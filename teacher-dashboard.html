<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard giáo viên · Tin học</title><link rel="stylesheet" href="style.css"><style>.dash{padding:38px 0 70px}.dash-head{display:flex;justify-content:space-between;gap:20px;align-items:end}.dash-filter{display:flex;gap:10px;flex-wrap:wrap}.dash-filter select,.dash-filter input{padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text)}.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.dash-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.dash-card b{display:block;font-size:30px}.dash-card span{color:var(--muted)}.dash-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.dash-bar{margin:12px 0}.dash-bar>div:first-child{display:flex;justify-content:space-between}.dash-bar-track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.dash-bar-track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}.weak-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.dash-status{margin-top:16px;color:var(--muted)}@media(max-width:800px){.dash-head{align-items:flex-start;flex-direction:column}.dash-grid,.dash-two{grid-template-columns:1fr 1fr}}@media(max-width:540px){.dash-grid,.dash-two{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="container nav"><div class="brand"><span class="brand-mark">GV</span><div><span>DASHBOARD GIÁO VIÊN</span><small>Dữ liệu tổng hợp · Không hiển thị tên học sinh</small></div></div><a class="btn ghost" href="index.html">← Website học sinh</a></div></header><main class="container dash"><div class="dash-head"><div><span class="eyebrow">MINH CHỨNG DỰA TRÊN DỮ LIỆU</span><h1 style="font-size:42px">Tổng quan lớp học</h1><p class="muted">Dashboard chỉ trả dữ liệu tổng hợp, không trả danh sách hoặc tên học sinh.</p></div><div class="dash-filter"><select id="grade"><option value="10">Tin 10</option><option value="11">Tin 11</option></select><input id="className" placeholder="Lớp, ví dụ 10A1"><button id="load" class="btn primary">Xem dữ liệu</button></div></div><div id="status" class="dash-status">Nhập lớp (có thể để trống để xem toàn khối), rồi bấm Xem dữ liệu.</div><div id="content"></div></main><script src="config.js"></script><script>
let timer=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function load(){const ep=String((window.APP_CONFIG||{}).RESULTS_ENDPOINT||'');if(!ep){status.textContent='Chưa cấu hình RESULTS_ENDPOINT.';return}status.textContent='Đang tải dữ liệu tổng hợp...';content.innerHTML='';const old=document.getElementById('jsonp');if(old)old.remove();const s=document.createElement('script');s.id='jsonp';s.src=ep+'?mode=summary&grade='+encodeURIComponent(grade.value)+'&className='+encodeURIComponent(className.value.trim())+'&callback=renderTeacherSummary&_='+Date.now();s.onerror=()=>fail();document.body.appendChild(s);clearTimeout(timer);timer=setTimeout(fail,7000)}function fail(){clearTimeout(timer);status.innerHTML='Không đọc được Dashboard. Nếu website học sinh vẫn gửi Sheets bình thường, hãy cập nhật <b>GOOGLE_APPS_SCRIPT_Code.gs.txt</b> của v12 và triển khai lại Web App.'}window.renderTeacherSummary=d=>{clearTimeout(timer);status.textContent=`Dữ liệu ${d.grade?'khối '+d.grade:''}${d.className?' · lớp '+d.className:''}`;const lv=d.levels||{};content.innerHTML=`<div class="dash-grid"><div class="dash-card"><b>${d.students||0}</b><span>Học sinh tham gia</span></div><div class="dash-card"><b>${d.attempts||0}</b><span>Lượt làm bài</span></div><div class="dash-card"><b>${d.avgScore||0}</b><span>Điểm trung bình /10</span></div><div class="dash-card"><b>${d.avgPercent||0}%</b><span>Độ chính xác</span></div></div><div class="dash-two"><div class="panel"><span class="eyebrow">THEO MỨC ĐỘ</span><h3>NB – TH – VD – VDC</h3>${['NB','TH','VD','VDC'].map(k=>`<div class="dash-bar"><div><b>${k}</b><span>${lv[k]?.pct||0}%</span></div><div class="dash-bar-track"><i style="width:${lv[k]?.pct||0}%"></i></div></div>`).join('')}</div><div class="panel"><span class="eyebrow">TRƯỚC – SAU</span><h3>Đánh giá năng lực</h3><div class="diagnostic-compare"><div><small>ĐẦU VÀO</small><b>${d.diagnostic?.preAvg??'--'}${d.diagnostic?.preAvg!=null?'%':''}</b><span>${d.diagnostic?.preCount||0} lượt</span></div><div class="compare-arrow">→<strong>${d.diagnostic?.delta==null?'':(d.diagnostic.delta>=0?'+':'')+d.diagnostic.delta+'%'}</strong></div><div><small>SAU ÔN</small><b>${d.diagnostic?.postAvg??'--'}${d.diagnostic?.postAvg!=null?'%':''}</b><span>${d.diagnostic?.postCount||0} lượt</span></div></div></div></div><div class="panel"><span class="eyebrow">DỮ LIỆU HỖ TRỢ RA QUYẾT ĐỊNH</span><h3>Bài có kết quả trung bình thấp</h3>${(d.weakLessons||[]).length?(d.weakLessons||[]).map(x=>`<div class="weak-row"><span>${esc(x.title)}</span><b>${x.avgPercent}% · ${x.attempts} lượt</b></div>`).join(''):'<p class="muted">Chưa có đủ lượt làm theo bài.</p>'}</div>`};load.onclick=()=>load();
</script></body></html>
